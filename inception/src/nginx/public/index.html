
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Welcome — Nginx Container</title>
  <style>
    /* Simple centered welcome card */
    html,body {
      height:100%;
      margin:0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(135deg, #0f172a 0%, #0b1220 100%);
      color: #edf2f7;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .wrap {
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border-radius:12px;
      padding:28px 36px;
      box-shadow: 0 6px 20px rgba(2,6,23,0.6);
      text-align:center;
      max-width:720px;
    }
    h1 {
      margin:0 0 8px 0;
      font-size:28px;
      letter-spacing: -0.02em;
    }
    p {
      margin:0;
      opacity:0.9;
    }
    .hint {
      margin-top:16px;
      font-size:13px;
      opacity:0.7;
    }
    .logo {
      width:56px;
      height:56px;
      border-radius:8px;
      background:linear-gradient(135deg,#06b6d4,#7c3aed);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      margin-bottom:14px;
      color:white;
      box-shadow: 0 4px 12px rgba(124,58,237,0.18);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="main" aria-labelledby="welcome">
      <div class="logo">NG</div>
      <h1 id="welcome">Welcome!</h1>
      <p>You successfully built and ran the Nginx container.</p>
      <div class="hint">
        Visit this page at <code>http://&lt;container-ip&gt;:88</code> or <code>https://localhost:88</code> if using the container port mapping.
      </div>
    </div>
  </div>
</body>
</html>

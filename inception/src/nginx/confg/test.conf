user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Settings
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip Settings
    gzip on;

    # ----------------------------------------------------------------------
    # SSL/TLS Configuration (Global Settings)
    # ----------------------------------------------------------------------

    # Protocols: Enable TLS 1.3 and TLS 1.2 (for compatibility).
    # Dropping TLS 1.0 and 1.1 is standard practice now.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Ciphers: 
    # TLS 1.3 ciphers are often implied, but we set specific strong suites here.
    # This list prioritizes ECDHE for Forward Secrecy and AES-GCM.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Prefer the server's cipher choice over the client's.
    ssl_prefer_server_ciphers on;

    # SSL Session Cache: Optimizes performance by caching handshake parameters.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off; # Disable tickets to force perfect forward secrecy (optional but recommended)

    # Diffie-Hellman Parameters
    # You should generate this file using: openssl dhparam -out /etc/nginx/dhparam.pem 2048
    # ssl_dhparam /etc/nginx/dhparam.pem; 

    # ----------------------------------------------------------------------
    # Virtual Host Configuration
    # ----------------------------------------------------------------------

    server {
        listen 80;
        listen [::]:80;
        server_name example.com www.example.com;

        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        # Listen on port 443 for SSL/TLS
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        
        server_name example.com www.example.com;

        # Path to your certificates (Example paths - change these!)
        ssl_certificate /etc/ssl/certs/example.com.crt;
        ssl_certificate_key /etc/ssl/private/example.com.key;

        # HSTS (HTTP Strict Transport Security)
        # Instructs browsers to only use HTTPS for the next 6 months.
        # Uncomment this ONLY after you have verified HTTPS works correctly.
        # add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

        # Root Directory
        root /var/www/html;
        index index.html index.htm index.nginx-debian.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}